# EXPECT: "larger than any single node". RuntimeClass overhead 3 CPU + main 3 CPU.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: {name: e2e-overhead}
handler: runc
overhead:
  podFixed: {cpu: "3"}
---
apiVersion: v1
kind: Pod
metadata: {name: overhead, namespace: s10}
spec:
  runtimeClassName: e2e-overhead
  containers:
    - name: c
      image: registry.k8s.io/pause:3.10
      resources: {requests: {cpu: "3"}}
